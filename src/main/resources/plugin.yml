name: PhysFlow
version: 1.0.0
main: com.yunexal.physex.PhysFlowPlugin
api-version: '1.16'
folia-supported: true
author: Nestor_Churin
description: Server-side finite water & lava physics overhaul (gravity, hydrostatic pressure, displacement, evaporation, piston push)

commands:
  physflow:
    description: Manage and configure PhysFlow finite water and lava physics
    usage: /<command> <status|reload|pause|resume|clearqueue|drain|fill|set>
    aliases: [pf, physex, fluidphysics, fluids]
    permission: physflow.admin

permissions:
  physflow.admin:
    description: Full access to PhysFlow administrative commands and live config reload
    default: op
